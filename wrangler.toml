# ConvertHub — static site + document conversion API (Cloudflare Containers)
name = "convert-hub"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[containers]]
class_name = "ConverterContainer"
image = "./services/converter/Dockerfile"
max_instances = 3

[[durable_objects.bindings]]
name = "CONVERTER"
class_name = "ConverterContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConverterContainer"]
